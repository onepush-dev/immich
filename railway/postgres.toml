# Postgres: Immich's own Postgres 14 image with the VectorChord + pgvecto.rs extensions,
# exactly the image and digest pinned by the upstream v3.3.3 docker-compose.yml.
# Plain Railway Postgres does NOT work (Immich needs the vchord extension for smart search
# and face embeddings). Private only.
[build]
image = "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"

[deploy]
# No start command: image ENTRYPOINT immich-docker-entrypoint.sh, CMD
# `postgres -c config_file=/etc/postgresql/postgresql.conf` (listens on 0.0.0.0 and ::).
# PGDATA points at a subdirectory of the volume so initdb doesn't trip over lost+found.
restartPolicyType = "ALWAYS"
drainingSeconds = 60
requiredMountPath = "/var/lib/postgresql/data"
